name: Build ADLYSIGN POS PRO APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'adlysign-pos-pro.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract POS ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q adlysign-pos-pro.zip -d project
          echo 'Extracted files:'
          find project -maxdepth 2 -type f | head -80

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e
          ROOT=$(find project -type f -name gradlew -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            if [ -f project/settings.gradle.kts ] && [ -d project/app ]; then ROOT=project; fi
          fi
          if [ -z "$ROOT" ]; then
            echo 'Android Gradle project not found in ZIP.'
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        working-directory: ${{ steps.locate.outputs.root }}
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          find '${{ steps.locate.outputs.root }}/app/build/outputs/apk' -type f -name '*.apk' -exec cp {} output/ \;
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADLYSIGN-POS-PRO-APK
          path: output/*.apk
          if-no-files-found: error
