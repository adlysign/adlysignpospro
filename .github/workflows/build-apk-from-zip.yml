name: Build ADLYSIGN POS PRO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q project.zip -d project

      - name: Find project root
        id: project
        shell: bash
        run: |
          ROOT=$(find project -type f -name package.json -print -quit)
          if [ -z "$ROOT" ]; then
            echo "ERROR: package.json tidak ditemukan di project.zip"
            exit 1
          fi
          ROOT=$(dirname "$ROOT")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor Android dependency
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          npm install --legacy-peer-deps --ignore-scripts
          test -f node_modules/@capacitor/android/capacitor/build.gradle
          echo "Capacitor Android ditemukan."

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "Android SDK: $SDK"
          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK tidak ditemukan"
            exit 1
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "SDK Android 36 siap."

      - name: Build APK
        working-directory: ${{ steps.project.outputs.root }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADLYSIGN-POS-PRO-APK
          path: ${{ steps.project.outputs.root }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
