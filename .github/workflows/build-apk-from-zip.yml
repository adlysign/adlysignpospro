name: Build ADLYSIGN POS PRO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q project.zip -d project

      - name: Find Android project
        id: android
        shell: bash
        run: |
          ANDROID_ROOT=$(find project -type f -path '*/android/gradlew' -printf '%h\n' | head -1)
          if [ -z "$ANDROID_ROOT" ]; then
            echo "ERROR: folder android/ dengan gradlew tidak ditemukan"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "root=$ANDROID_ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project: $ANDROID_ROOT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK directly
        working-directory: ${{ steps.android.outputs.root }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADLYSIGN-POS-PRO-APK
          path: ${{ steps.android.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
