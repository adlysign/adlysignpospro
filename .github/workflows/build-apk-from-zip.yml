name: Build DodolanPro APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'dodolanpro.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract DodolanPro ZIP
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q dodolanpro.zip -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -120

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e
          ROOT=""

          ROOT=$(find project -type f -name gradlew -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
            if [ -n "$SETTINGS" ]; then
              CANDIDATE=$(dirname "$SETTINGS")
              if [ -d "$CANDIDATE/app" ]; then
                ROOT="$CANDIDATE"
              fi
            fi
          fi

          if [ -z "$ROOT" ] && [ -f project/settings.gradle.kts ] && [ -d project/app ]; then
            ROOT="project"
          fi

          if [ -z "$ROOT" ]; then
            echo "Android Gradle project not found in ZIP."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -e
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x gradlew

      - name: Diagnose Android project
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          echo "=== Gradle ==="
          ./gradlew --version

          echo "=== Build files ==="
          find . -maxdepth 3 -type f \(             -name "build.gradle" -o             -name "build.gradle.kts" -o             -name "settings.gradle" -o             -name "settings.gradle.kts" -o             -name "gradle.properties"           \) -print

          echo "=== Google services files ==="
          find . -type f -name "google-services.json" -print || true

          echo "=== KSP references ==="
          grep -RniE "com\.google\.devtools\.ksp|ksp\(" .             --include="*.gradle" --include="*.gradle.kts" --include="libs.versions.toml"             | head -80 || true

      - name: Handle missing Google Services configuration
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -e

          if find . -type f -name "google-services.json" | grep -q .; then
            echo "google-services.json found. Google Services plugin remains enabled."
            exit 0
          fi

          echo "google-services.json is missing."
          echo "For this CI debug build, disable the Google Services Gradle plugin."

          # Remove only direct application of the Google Services plugin.
          # Firebase libraries themselves are not removed.
          while IFS= read -r -d '' f; do
            sed -i               -e '/^[[:space:]]*id[[:space:]]*(\x27com\.google\.gms\.google-services\x27\|"com\.google\.gms\.google-services")[^)]*)[[:space:]]*$/d'               -e '/^[[:space:]]*apply[[:space:]]\+plugin:[[:space:]]*['"'"']com\.google\.gms\.google-services['"'"'][[:space:]]*$/d'               "$f"
          done < <(find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0)

          echo "Google Services plugin lines after patch:"
          grep -Rni "google-services" . --include="*.gradle" --include="*.gradle.kts" || true

      - name: Configure CI-safe Gradle settings
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -e
          touch gradle.properties

          # Avoid JVM target mismatch and reduce KSP/Gradle cache-related issues.
          if ! grep -q '^org.gradle.jvmargs=' gradle.properties; then
            printf '\norg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true\n' >> gradle.properties
          fi

          if ! grep -q '^ksp.incremental=' gradle.properties; then
            printf 'ksp.incremental=false\n' >> gradle.properties
          fi

      - name: Verify Gradle configuration
        working-directory: ${{ steps.locate.outputs.root }}
        run: ./gradlew --version

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          ./gradlew --no-daemon --stacktrace --info assembleDebug

      - name: Collect APK
        run: |
          set -e
          mkdir -p output

          find "${{ steps.locate.outputs.root }}/app/build/outputs/apk"             -type f -name "*.apk"             -exec cp {} output/ \;

          echo "Generated APK files:"
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DODOLANPRO-APK
          path: output/*.apk
          if-no-files-found: error
