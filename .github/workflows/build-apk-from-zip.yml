name: Build ADLYSIGN POS PRO APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q project.zip -d project

      - name: Locate Android project
        id: android
        run: |
          ROOT=$(find project -type f -name gradlew -print -quit)
          if [ -z "$ROOT" ]; then
            echo "ERROR: file gradlew tidak ditemukan di project.zip"
            exit 1
          fi
          ROOT=$(dirname "$ROOT")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project ditemukan: $ROOT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Build APK
        working-directory: ${{ steps.android.outputs.root }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADLYSIGN-POS-PRO-APK
          path: ${{ steps.android.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
