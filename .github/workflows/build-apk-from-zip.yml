name: Build DodolanPro APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'dodolanpro.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract DodolanPro ZIP
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q dodolanpro.zip -d project

          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          ROOT=""

          ROOT=$(find project -type f -name gradlew -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

            if [ -n "$SETTINGS" ]; then
              CANDIDATE=$(dirname "$SETTINGS")
              if [ -d "$CANDIDATE/app" ]; then
                ROOT="$CANDIDATE"
              fi
            fi
          fi

          if [ -z "$ROOT" ] && [ -f project/settings.gradle.kts ] && [ -d project/app ]; then
            ROOT="project"
          fi

          if [ -z "$ROOT" ]; then
            echo "Android Gradle project not found in ZIP."
            exit 1
          fi

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.locate.outputs.root }}
        shell: bash
        run: |
          set -e

          # The project requires Gradle 9.3.1.
          # Force the wrapper to use the required version instead of an older
          # wrapper bundled in the ZIP.
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin

          chmod +x gradlew

          echo "Gradle wrapper configuration:"
          grep -n "distributionUrl" gradle/wrapper/gradle-wrapper.properties || true

      - name: Verify Gradle version
        working-directory: ${{ steps.locate.outputs.root }}
        run: ./gradlew --version

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          set -e
          mkdir -p output

          find "${{ steps.locate.outputs.root }}/app/build/outputs/apk"             -type f             -name "*.apk"             -exec cp {} output/ \;

          echo "Generated APK files:"
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DODOLANPRO-APK
          path: output/*.apk
          if-no-files-found: error
