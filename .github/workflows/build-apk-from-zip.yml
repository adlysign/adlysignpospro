name: Build ADLYSIGN POS PRO APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'adlysign-pos-pro.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract POS ZIP
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q adlysign-pos-pro.zip -d project
          echo "ZIP extracted"

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e
          ROOT=$(find project -type f -name settings.gradle.kts -print -quit | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 36 SDK packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p output
          find "${{ steps.locate.outputs.root }}/app/build/outputs/apk" \
            -type f -name '*.apk' -exec cp {} output/ \;
          ls -lh output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADLYSIGN-POS-PRO-APK
          path: output/*.apk
          if-no-files-found: error
